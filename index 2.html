<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>MyFitForm</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0b0c">

<!-- Instalação no iPhone (Adicionar ao ecrã principal) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyFitForm">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="device" id="device">
  <div class="screen-viewport" id="viewport">
    <!-- os ecrãs são renderizados aqui pelo router (js/app.js) -->
  </div>
  <div id="bottom-nav-container">
    <!-- barra de navegação inferior: fixa, fora da área com scroll -->
  </div>
</div>

<!-- Supabase (script clássico via CDN — sem build step) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<!-- Configuração e camadas da aplicação -->
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>

<script>
  // Service worker desativado nesta fase de testes (ver sw.js).
  // Mantemos o registo apenas para limpar instalações antigas nos
  // telefones que já tinham a versão anterior instalada.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
